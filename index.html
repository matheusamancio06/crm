<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LeadSite CRM — Prospecção de Sites</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --surface3: #30363d;
    --border: #30363d;
    --border2: #3d444d;
    --text: #e6edf3;
    --text2: #8b949e;
    --text3: #6e7681;
    --accent: #2f81f7;
    --accent-dim: #1f6feb33;
    --green: #3fb950;
    --green-dim: #3fb95022;
    --yellow: #d29922;
    --yellow-dim: #d2992222;
    --red: #f85149;
    --red-dim: #f8514922;
    --purple: #8b5cf6;
    --purple-dim: #8b5cf622;
    --orange: #f97316;
    --orange-dim: #f9731622;
    --radius: 8px;
    --radius-lg: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; min-height: 100vh; }

  /* LAYOUT */
  .app { display: flex; flex-direction: column; min-height: 100vh; }
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 100; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
  .logo-icon { width: 28px; height: 28px; background: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .main { flex: 1; padding: 24px; max-width: 1600px; margin: 0 auto; width: 100%; }

  /* TABS */
  .tabs { display: flex; gap: 2px; margin-bottom: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px; width: fit-content; }
  .tab { padding: 7px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); transition: all .15s; border: none; background: none; }
  .tab.active { background: var(--surface3); color: var(--text); }
  .tab:hover:not(.active) { color: var(--text); }

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }
  .stat-label { font-size: 12px; color: var(--text2); font-weight: 500; letter-spacing: .02em; margin-bottom: 8px; }
  .stat-value { font-size: 28px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .stat-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .stat-card.green .stat-value { color: var(--green); }
  .stat-card.blue .stat-value { color: var(--accent); }
  .stat-card.yellow .stat-value { color: var(--yellow); }
  .stat-card.red .stat-value { color: var(--red); }
  .stat-card.purple .stat-value { color: var(--purple); }

  /* FILTERS */
  .filters-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; align-items: center; }
  .search-wrap { position: relative; flex: 1; min-width: 220px; max-width: 380px; }
  .search-wrap input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px 8px 36px; color: var(--text); font-size: 13px; font-family: 'Inter', sans-serif; outline: none; transition: border-color .15s; }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 15px; }
  select { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; color: var(--text); font-size: 13px; font-family: 'Inter', sans-serif; outline: none; cursor: pointer; }
  select:focus { border-color: var(--accent); }

  /* LEADS TABLE */
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  .table-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .table-title { font-size: 13px; font-weight: 500; color: var(--text2); }
  table { width: 100%; border-collapse: collapse; }
  thead th { padding: 10px 16px; text-align: left; font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px solid var(--border); background: var(--surface2); }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; cursor: pointer; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }
  td { padding: 14px 16px; vertical-align: middle; }
  .lead-name { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
  .lead-meta { font-size: 11px; color: var(--text2); }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-alta { background: var(--green-dim); color: var(--green); }
  .badge-media { background: var(--yellow-dim); color: var(--yellow); }
  .badge-baixa { background: var(--red-dim); color: var(--red); }
  .badge-site { background: var(--purple-dim); color: var(--purple); }
  .badge-nosite { background: var(--orange-dim); color: var(--orange); }
  .stars { color: var(--yellow); font-size: 12px; }
  .rating-count { color: var(--text3); font-size: 11px; margin-left: 4px; }
  .contact-links { display: flex; gap: 6px; flex-wrap: wrap; }
  .contact-link { font-size: 11px; padding: 3px 8px; border-radius: 4px; cursor: pointer; text-decoration: none; font-weight: 500; border: none; }
  .cl-whatsapp { background: #25d36622; color: #25d366; }
  .cl-maps { background: var(--red-dim); color: var(--red); }
  .cl-site { background: var(--accent-dim); color: var(--accent); }
  .cl-insta { background: #e1306c22; color: #e1306c; }
  .cl-copy { background: var(--surface3); color: var(--text2); }
  .status-select { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; color: var(--text); font-size: 11px; font-family: 'Inter', sans-serif; cursor: pointer; }
  .action-btn { background: none; border: none; cursor: pointer; color: var(--text2); font-size: 18px; padding: 4px 6px; border-radius: 4px; transition: all .15s; }
  .action-btn:hover { background: var(--surface3); color: var(--text); }
  .star-btn { color: var(--text3); }
  .star-btn.starred { color: #f0c040; }

  /* BUTTONS */
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all .15s; font-family: 'Inter', sans-serif; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #388bfd; }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn-danger { background: var(--red-dim); color: var(--red); border: 1px solid var(--red); }
  .btn-danger:hover { background: var(--red); color: #fff; }
  .btn-green { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }
  .btn-green:hover { background: var(--green); color: #000; }
  .btn-sm { padding: 5px 12px; font-size: 12px; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: #00000099; z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-lg); width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; }
  .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-size: 16px; font-weight: 700; }
  .modal-body { padding: 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .form-row.full { grid-template-columns: 1fr; }
  .form-row.three { grid-template-columns: 1fr 1fr 1fr; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; font-weight: 500; color: var(--text2); }
  .field input, .field select, .field textarea { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 12px; color: var(--text); font-size: 13px; font-family: 'Inter', sans-serif; outline: none; transition: border-color .15s; width: 100%; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 80px; }

  /* DETAILS PANEL */
  .detail-section { margin-bottom: 20px; }
  .detail-section-title { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 10px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .detail-item { background: var(--surface2); border-radius: var(--radius); padding: 10px 14px; }
  .detail-item-label { font-size: 11px; color: var(--text3); margin-bottom: 3px; }
  .detail-item-value { font-size: 13px; font-weight: 500; word-break: break-word; }

  /* NOTES / HISTORY */
  .note-item { background: var(--surface2); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
  .note-meta { font-size: 11px; color: var(--text3); margin-bottom: 6px; }
  .note-text { font-size: 13px; line-height: 1.5; }

  /* KANBAN */
  .kanban-wrap { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 16px; }
  .kanban-col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); min-width: 260px; max-width: 280px; flex-shrink: 0; }
  .kanban-col-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .kanban-col-title { font-size: 12px; font-weight: 600; }
  .kanban-count { background: var(--surface3); color: var(--text2); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
  .kanban-cards { padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
  .kanban-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; cursor: pointer; transition: border-color .15s; }
  .kanban-card:hover { border-color: var(--accent); }
  .kanban-card-name { font-weight: 600; font-size: 12px; margin-bottom: 4px; }
  .kanban-card-meta { font-size: 11px; color: var(--text2); }
  .kanban-card-badges { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }

  /* ANALYTICS */
  .analytics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }
  .chart-title { font-size: 13px; font-weight: 600; margin-bottom: 16px; }
  .bar-list { display: flex; flex-direction: column; gap: 10px; }
  .bar-item { display: flex; flex-direction: column; gap: 4px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 12px; }
  .bar-track { background: var(--surface3); border-radius: 4px; height: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width .5s ease; }
  .donut-wrap { display: flex; align-items: center; justify-content: center; gap: 24px; }
  .donut-legend { display: flex; flex-direction: column; gap: 8px; }
  .donut-legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .donut-dot { width: 10px; height: 10px; border-radius: 50%; }

  /* IMPORT */
  .import-area { border: 2px dashed var(--border2); border-radius: var(--radius-lg); padding: 40px; text-align: center; cursor: pointer; transition: border-color .15s; }
  .import-area:hover { border-color: var(--accent); }
  .import-area.drag { border-color: var(--accent); background: var(--accent-dim); }
  .import-icon { font-size: 40px; margin-bottom: 12px; }

  /* TOAST */
  .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 12px 16px; font-size: 13px; min-width: 240px; display: flex; align-items: center; gap: 10px; animation: slideIn .2s ease; box-shadow: 0 4px 20px #00000066; }
  .toast.success { border-color: var(--green); }
  .toast.error { border-color: var(--red); }
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* EMPTY */
  .empty-state { padding: 60px; text-align: center; color: var(--text3); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-text { font-size: 14px; margin-bottom: 4px; color: var(--text2); }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }

  /* LOADING */
  .loading { display: flex; align-items: center; justify-content: center; padding: 60px; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--surface3); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* PROGRESS */
  .progress-bar { background: var(--surface3); border-radius: 4px; height: 4px; overflow: hidden; margin-top: 6px; }
  .progress-fill { height: 100%; background: var(--accent); transition: width .4s; }

  /* SEPARATOR */
  .section-sep { height: 1px; background: var(--border); margin: 20px 0; }

  .tag-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tag { background: var(--surface3); color: var(--text2); font-size: 11px; padding: 3px 8px; border-radius: 4px; }

  .priority-indicator { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .p-alta { background: var(--green); }
  .p-media { background: var(--yellow); }
  .p-baixa { background: var(--red); }

  @media (max-width: 768px) {
    .main { padding: 16px; }
    .form-row { grid-template-columns: 1fr; }
    .analytics-grid { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading"><div class="spinner"></div></div>
</div>

<div class="toast-container" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Supabase config
const SUPABASE_URL = 'https://smqxwlcaksgejfmorpsz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtcXh3bGNha3NnZWpmbW9ycHN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDkxNjksImV4cCI6MjEwNTU4NTE2OX0.q2BjIppruXG8ocO5VUABGkXw3ZUUQLvgUdr2XettIrU';
const { createClient } = window.supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const STATUS_OPTIONS = ['Novo','Contatado','Proposta Enviada','Em Negociação','Fechado','Descartado'];
const OPP_OPTIONS = ['Alta','Média','Baixa'];
const NICHO_OPTIONS = ['Restaurante','Bar/Lanchonete','Salão de Beleza','Academia','Clínica','Advocacia','Contabilidade','Imobiliária','Comércio','Serviços','Educação','Hotel/Pousada','Petshop','Farmácia','Outros'];
const STATUS_COLOR = { 'Novo':'#8b5cf6','Contatado':'#2f81f7','Proposta Enviada':'#d29922','Em Negociação':'#f97316','Fechado':'#3fb950','Descartado':'#f85149' };

let leads = [];
let filteredLeads = [];
let currentTab = 'leads';
let filters = { search:'', cidade:'', status:'', oportunidade:'', site:'', nicho:'' };
let sortField = 'oportunidade';
let sortDir = 'desc';
let currentModal = null;
let selectedLead = null;
let searchResults = [];

// ── INIT ──────────────────────────────────────────────────────────────
async function init() {
  renderLoading();
  try {
    await loadLeads();
    subscribeLeads();
  } catch(e) {
    console.error(e);
    showToast('Erro ao conectar ao banco: ' + e.message, 'error');
  }
}

async function loadLeads() {
  try {
    const { data, error } = await sb
      .from('leads')
      .select('*')
      .order('criadoem', { ascending: false });
    
    if (error) {
      const msg = error.message || error.details || error.hint || JSON.stringify(error);
      console.error('Erro ao carregar leads:', msg, error);
      renderError('Erro ao carregar dados: ' + msg);
      return;
    }
    
    leads = data || [];
    applyFiltersAndRender();
  } catch(e) {
    const msg = e?.message || String(e);
    console.error('Falha de conexão:', msg, e);
    renderError('Falha de conexão com o banco: ' + msg + ' — isso costuma acontecer no preview do Claude (bloqueia chamadas externas). Teste no link publicado (Netlify).');
  }
}

function renderError(msg) {
  document.getElementById('app').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px">
      <div style="text-align:center;max-width:480px">
        <div style="font-size:48px;margin-bottom:16px">⚠️</div>
        <div style="font-size:16px;font-weight:700;margin-bottom:10px;color:var(--red)">Não foi possível carregar os dados</div>
        <div style="color:var(--text2);font-size:13px;line-height:1.6;background:var(--surface2);padding:12px;border-radius:8px;font-family:monospace;text-align:left;word-break:break-word">${msg}</div>
        <button class="btn btn-primary btn-sm" style="margin-top:16px" onclick="init()">🔄 Tentar novamente</button>
      </div>
    </div>
  `;
}

function subscribeLeads() {
  const subscription = sb
    .channel('leads-changes')
    .on('postgres_changes', 
      { event: '*', schema: 'public', table: 'leads' },
      payload => {
        loadLeads();
      }
    )
    .subscribe();
}

// ── FILTER & SORT ──────────────────────────────────────────────────────
function applyFiltersAndRender() {
  let list = [...leads];
  const q = filters.search.toLowerCase();
  if (q) list = list.filter(l =>
    (l.nome||'').toLowerCase().includes(q) ||
    (l.cidade||'').toLowerCase().includes(q) ||
    (l.telefone||'').toLowerCase().includes(q) ||
    (l.endereco||'').toLowerCase().includes(q) ||
    (l.nicho||'').toLowerCase().includes(q)
  );
  if (filters.cidade) list = list.filter(l => (l.cidade||'') === filters.cidade);
  if (filters.status) list = list.filter(l => (l.status||'Novo') === filters.status);
  if (filters.oportunidade) list = list.filter(l => (l.oportunidade||'') === filters.oportunidade);
  if (filters.nicho) list = list.filter(l => (l.nicho||'') === filters.nicho);
  if (filters.site === 'sem') list = list.filter(l => !l.site || l.site === '');
  if (filters.site === 'com') list = list.filter(l => l.site && l.site !== '');

  list.sort((a,b) => {
    let va = a[sortField] ?? '', vb = b[sortField] ?? '';
    if (sortField === 'oportunidade') {
      const order = {Alta:0, Média:1, Baixa:2};
      va = order[va] ?? 9; vb = order[vb] ?? 9;
    }
    if (sortField === 'avaliacao') { va = parseFloat(va)||0; vb = parseFloat(vb)||0; }
    if (va < vb) return sortDir === 'asc' ? -1 : 1;
    if (va > vb) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });

  filteredLeads = list;
  renderApp();
}

// ── RENDER ─────────────────────────────────────────────────────────────
function renderApp() {
  const app = document.getElementById('app');
  const cidades = [...new Set(leads.map(l => l.cidade).filter(Boolean))].sort();
  const nichos = [...new Set(leads.map(l => l.nicho).filter(Boolean))].sort();
  const stats = computeStats();

  app.innerHTML = `
    <div class="topbar">
      <div class="logo">
        <div class="logo-icon">🎯</div>
        <span>LeadSite CRM</span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="openSearch()" title="Buscar empresas no Google">🔍 Buscar Google</button>
        <button class="btn btn-ghost btn-sm" onclick="openImport()">⬆ Importar CSV</button>
        <button class="btn btn-ghost btn-sm" onclick="exportCSV()">⬇ Exportar CSV</button>
        <button class="btn btn-primary btn-sm" onclick="openAddLead()">+ Novo Lead</button>
      </div>
    </div>
    <div class="main">
      <div class="tabs">
        ${['leads','kanban','analytics','prompts'].map(t => `
          <button class="tab ${currentTab===t?'active':''}" onclick="switchTab('${t}')">
            ${{leads:'📋 Leads', kanban:'📊 Kanban', analytics:'📈 Analytics', prompts:'✉️ Prompts'}[t]}
          </button>
        `).join('')}
      </div>

      <div class="stats-grid">
        <div class="stat-card blue">
          <div class="stat-label">Total de Leads</div>
          <div class="stat-value">${leads.length}</div>
          <div class="stat-sub">na base de dados</div>
        </div>
        <div class="stat-card green">
          <div class="stat-label">Alta Oportunidade</div>
          <div class="stat-value">${stats.alta}</div>
          <div class="stat-sub">bom potencial para site</div>
        </div>
        <div class="stat-card yellow">
          <div class="stat-label">Sem Site Próprio</div>
          <div class="stat-value">${stats.semSite}</div>

function computeStats() {
  const alta = leads.filter(l=>l.oportunidade==='Alta').length;
  const media = leads.filter(l=>l.oportunidade==='Média').length;
  const baixa = leads.filter(l=>l.oportunidade==='Baixa').length;
  const semSite = leads.filter(l=>!l.site||l.site==='').length;
  const comTel = leads.filter(l=>l.telefone&&l.telefone!=='').length;
  const fechados = leads.filter(l=>l.status==='Fechado').length;
  const ratings = leads.map(l=>parseFloat(l.avaliacao)).filter(n=>!isNaN(n)&&n>0);
  const avgRating = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(2) : '—';
  return {alta,media,baixa,semSite,comTel,fechados,avgRating};
}

async function performSearch() {
  let nicho = document.getElementById('searchNicho')?.value?.trim();
  const nichoCustom = document.getElementById('searchNichoCustom')?.value?.trim();
  const cidade = document.getElementById('searchCidade')?.value?.trim();
  
  if (nicho === 'custom') nicho = nichoCustom;
  if (!nicho || !cidade) { showToast('Preencha nicho e cidade', 'error'); return; }
  
  const preview = document.getElementById('searchPreview');
  preview.innerHTML = `<div class="loading"><div class="spinner"></div></div>`;
  
  try {
    const results = await searchCompanies(nicho, cidade);
    searchResults = results;
    
    if (results.length === 0) {
      preview.innerHTML = `<div style="color:var(--text3);text-align:center;padding:20px">Nenhuma empresa encontrada para "${nicho}" em "${cidade}"</div>`;
      return;
    }
    
    preview.innerHTML = `
      <div style="color:var(--green);margin-bottom:12px;font-weight:600">✅ ${results.length} empresa${results.length!==1?'s':''} encontrada${results.length!==1?'s':''}</div>
      <div style="background:var(--surface2);border-radius:var(--radius);padding:12px;max-height:300px;overflow-y:auto">
        ${results.slice(0,10).map((r,i) => `
          <div style="padding:12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s" onclick="selectSearchResult(${i})" class="search-item-${i}">
            <div style="font-weight:600;font-size:13px">${r.name}</div>
            <div style="color:var(--text2);font-size:11px;margin-top:2px">${r.address || '—'}</div>
            <div style="color:var(--text3);font-size:11px;margin-top:2px">
              ${r.rating ? '⭐ ' + r.rating + ' (' + r.review_count + ' aval.)' : '—'} 
              ${r.phone ? ' · 📞 ' + r.phone : ''}
            </div>
          </div>
        `).join('')}
        ${results.length > 10 ? `<div style="padding:12px;color:var(--text3);text-align:center">... e mais ${results.length-10} empresa${results.length-10!==1?'s':''}</div>` : ''}
      </div>
      <div style="margin-top:12px;padding:12px;background:var(--accent-dim);border-radius:var(--radius);color:var(--text2);font-size:12px">
        Clique em uma empresa para adicionar ao CRM
      </div>
    `;
  } catch(e) {
    preview.innerHTML = `<div style="color:var(--red);padding:16px;background:var(--red-dim);border-radius:var(--radius)">${e.message}</div>`;
  }
}

async function searchCompanies(nicho, cidade) {
  // Chama a Netlify Function (backend), que por sua vez chama a SerpAPI.
  // Isso evita o bloqueio de CORS e mantém a chave de API fora do navegador.
  const url = `/.netlify/functions/search-leads?nicho=${encodeURIComponent(nicho)}&cidade=${encodeURIComponent(cidade)}`;
  
  const response = await fetch(url);
  const data = await response.json();
  
  if (data.error) throw new Error(data.error);
  return data.results || [];
}

function selectSearchResult(idx) {
  const r = searchResults[idx];

  selectedLead = r;

        site: r.website || '',

        oportunidade: r.website ? 'Baixa' : 'Alta',

        favorito: false,

      }]);

  } catch(e) {
    showToast('Erro ao adicionar lead: ' + e.message, 'error');

async function saveLead(id) {
  const nome = document.getElementById('f_nome')?.value?.trim();
  if (!nome) { showToast('Nome da empresa é obrigatório', 'error'); return; }

  const data = {
    nome, nicho: g('f_nicho'), cidade: g('f_cidade'), estado: g('f_estado'),
    endereco: g('f_endereco'), telefone: g('f_telefone'), email: g('f_email'),
    site: g('f_site'), instagram: g('f_instagram'), googlemaps: g('f_googleMaps'),
    facebook: g('f_facebook'), avaliacao: g('f_avaliacao') ? parseFloat(g('f_avaliacao')) : null, 
    avaliacaocount: g('f_avaliacaoCount'),
    score: g('f_score') ? parseInt(g('f_score')) : null,
    oportunidade: g('f_oportunidade') || 'Média', status: g('f_status') || 'Novo',
    obs: g('f_obs'), atualizadoem: new Date().toISOString()
  };

  try {
    if (id) {
      const old = leads.find(l=>l.id===id);
      const historico = old?.historico || [];
      if (old?.status !== data.status) {
        historico.push({ status: data.status, data: formatDate(new Date()) });
      }
      data.historico = historico;
      
      const { error } = await sb
        .from('leads')
        .update(data)
        .eq('id', id);
      
      if (error) throw error;
      showToast('Lead atualizado com sucesso ✅', 'success');
    } else {
      data.favorito = false;
      data.notas = [];
      data.historico = [{ status: data.status, data: formatDate(new Date()) }];
      data.criadoem = new Date().toISOString();
      
      const { error } = await sb
        .from('leads')
        .insert([data]);
      
      if (error) throw error;
      showToast('Lead adicionado com sucesso ✅', 'success');
    }
    closeModal();
    await loadLeads();
  } catch(e) {
    showToast('Erro ao salvar: ' + e.message, 'error');
  }
}

async function updateStatus(id, status) {
  try {
    const l = leads.find(x=>x.id===id);
    const historico = l?.historico || [];
    historico.push({ status, data: formatDate(new Date()) });
    
    const { error } = await sb
      .from('leads')
      .update({ status, historico, atualizadoem: new Date().toISOString() })
      .eq('id', id);
    
    if (error) throw error;
    await loadLeads();
  } catch(e) {
    showToast('Erro ao atualizar status', 'error');
  }
}

async function addNote(id) {
  const inp = document.getElementById(`noteInput_${id}`);
  const texto = inp?.value?.trim();
  if (!texto) return;
  const l = leads.find(x=>x.id===id);
  const notas = l?.notas || [];
  notas.push({ texto, data: formatDate(new Date()) });
  try {
    const { error } = await sb
      .from('leads')
      .update({ notas })
      .eq('id', id);
    
    if (error) throw error;
    inp.value = '';

function confirmDelete(id) {

let pendingImport = [];

function handleFileDrop(e) {
  e.preventDefault();
  document.getElementById('importArea').classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if (file) processCSV(file);
}

function handleFileInput(inp) {
  const file = inp.files[0];
  if (file) processCSV(file);
}

function processCSV(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.split('\n').filter(Boolean);
    if (lines.length < 2) { showToast('CSV vazio ou inválido', 'error'); return; }
    const headers = lines[0].split(',').map(h=>h.trim().replace(/"/g,'').toLowerCase());
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const vals = splitCSVLine(lines[i]);
      const obj = {};
      headers.forEach((h,j) => obj[h] = (vals[j]||'').replace(/"/g,'').trim());
      if (obj.nome) rows.push(obj);
    }
    pendingImport = rows;
    const preview = document.getElementById('importPreview');
    const importBtn = document.getElementById('importBtn');
    if (rows.length === 0) {
      preview.innerHTML = `<div style="color:var(--red)">Nenhum lead válido encontrado no arquivo.</div>`;
      return;
    }
    preview.innerHTML = `
      <div style="color:var(--green);margin-bottom:10px;font-weight:600">✅ ${rows.length} lead${rows.length!==1?'s':''} encontrado${rows.length!==1?'s':''}</div>
      <div style="background:var(--surface2);border-radius:var(--radius);padding:12px;max-height:200px;overflow-y:auto">
        ${rows.slice(0,5).map(r=>`<div style="font-size:12px;color:var(--text2);padding:4px 0;border-bottom:1px solid var(--border)">${r.nome} · ${r.cidade||'—'} · ${r.status||'Novo'}</div>`).join('')}
        ${rows.length > 5 ? `<div style="font-size:12px;color:var(--text3);padding:4px 0">... e mais ${rows.length-5} leads</div>` : ''}
      </div>
    `;
    importBtn.style.display = 'flex';
  };
  reader.readAsText(file);
}

function splitCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === '"') inQuotes = !inQuotes;
    else if (line[i] === ',' && !inQuotes) { result.push(current); current = ''; }
    else current += line[i];
  }
  result.push(current);
  return result;
}

async function confirmImport() {
  if (!pendingImport.length) return;
  const btn = document.getElementById('importBtn');
  btn.textContent = 'Importando...';
  btn.disabled = true;
  let ok = 0, err = 0;
  
  const leadsToInsert = pendingImport.map(row => ({
    nome: row.nome||'', nicho: row.nicho||'', cidade: row.cidade||'',
    estado: row.estado||'', endereco: row.endereco||'', telefone: row.telefone||'',
    email: row.email||'', site: row.site||'', instagram: row.instagram||'',
    googlemaps: row.googlemaps||row.google_maps||'',
    avaliacao: row.avaliacao ? parseFloat(row.avaliacao) : null,
    avaliacaocount: row.avaliacaocount||row.avaliacao_count||'',
    score: row.score ? parseInt(row.score) : null,
    oportunidade: row.oportunidade ? capitalize(row.oportunidade) : 'Média',
    status: row.status ? capitalize(row.status) : 'Novo',
    obs: row.obs||row.observacoes||'',
    favorito: false, notas: [], historico: [],
    criadoem: new Date().toISOString(), atualizadoem: new Date().toISOString()
  }));
  
  try {
    const { error } = await sb
      .from('leads')
      .insert(leadsToInsert);
    
    if (error) throw error;
    ok = pendingImport.length;
  } catch(e) {
    err = pendingImport.length;
  }
  
  closeModal();
  showToast(`${ok} lead${ok!==1?'s':''} importado${ok!==1?'s':''}${err?' ('+err+' erro)':''}  ✅`, 'success');
  pendingImport = [];
  await loadLeads();
}

function exportCSV() {
  const list = filteredLeads.length > 0 ? filteredLeads : leads;
  if (list.length === 0) { showToast('Nenhum lead para exportar', 'error'); return; }
  const headers = ['nome','nicho','cidade','estado','endereco','telefone','email','site','instagram','googlemaps','avaliacao','avaliacaocount','score','oportunidade','status','obs'];
  const rows = list.map(l => headers.map(h => `"${(l[h]||'').toString().replace(/"/g,'""')}"`).join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `leads_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
  showToast(`${list.length} leads exportados ✅`, 'success');
}

// ── HELPERS ────────────────────────────────────────────────────────────
function g(id) { return document.getElementById(id)?.value?.trim() || ''; }
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); }
function formatDate(d) { return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'}); }
function formatWhatsApp(tel) { return tel.replace(/\D/g,''); }
function clearFilters() { filters = {search:'',cidade:'',status:'',oportunidade:'',site:'',nicho:''}; applyFiltersAndRender(); }
function switchTab(tab) { currentTab = tab; applyFiltersAndRender(); }

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => showToast('Copiado para a área de transferência ✅', 'success'));
}

function showModal(html) {
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal';
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
  currentModal = overlay;
}

function closeModal() {
  if (currentModal) { currentModal.remove(); currentModal = null; }
}

function showToast(msg, type = 'success') {
  const container = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span><span>${msg}</span>`;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

init();
</script>
